<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1326FD" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' https://telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.hyperliquid.xyz https://api.coingecko.com;"
    />
    <meta
      http-equiv="Permissions-Policy"
      content="accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    />
    <title>MC Recovery Fund - Интерактивный контент</title>
    <meta
      name="description"
      content="Интерактивное образовательно-развлекательное приложение для инвесторов MC Recovery Fund. Квизы, инструкции, эфиры и документы."
    />
    <link rel="icon" href="./assets/images/favicon.webp" type="image/webp" />
    <!-- Resource Hints for Performance -->
    <link rel="preconnect" href="https://api.hyperliquid.xyz" />
    <link rel="preconnect" href="https://api.coingecko.com" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />

    <!-- Preload critical assets -->
    <link
      rel="preload"
      href="./assets/images/favicon.webp"
      as="image"
      type="image/webp"
    />
    <link rel="modulepreload" href="./js/app-main.js" />

    <!-- Modulepreload для критических ES модулей -->
    <link rel="modulepreload" href="./js/core/state.js" />
    <link rel="modulepreload" href="./js/core/config.js" />
    <link rel="modulepreload" href="./js/modules/telegram.js" />
    <link rel="modulepreload" href="./js/modules/navigation.js" />
    <link rel="modulepreload" href="./js/components/home.js" />

    <!-- Critical CSS - инлайн для мгновенного рендеринга -->
    <link rel="stylesheet" href="./css/critical.css" />
    <!-- Полный CSS -->
    <link rel="stylesheet" href="./css/styles.css" />
    <!-- Trading Terminal CSS -->
    <link rel="stylesheet" href="./css/trading-terminal.css" />
    <!-- Onboarding CSS загружается динамически только когда нужен -->

    <!-- Fonts - загружаются асинхронно с помощью media трюка -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic"
      media="print"
      onload="this.media='all'"
    />
    <noscript
      ><link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=cyrillic"
        rel="stylesheet"
    /></noscript>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Theme Initialization -->
    <script src="./js/init-theme.js"></script>
  </head>
  <body>
    <!-- Skip Links для keyboard navigation -->
    <a href="#content" class="skip-link">Перейти к основному содержанию</a>
    <a href="#tabBar" class="skip-link">Перейти к навигации</a>
    
    <!-- App Container -->
    <div id="app" class="app">
      <!-- Top Bar -->
      <header class="topbar">
        <div class="topbar-content">
          <div class="topbar-logo">
            <img
              src="./assets/images/favicon.webp"
              alt="MC Recovery Fund"
              width="28"
              height="28"
              style="border-radius: 6px"
              loading="eager"
              decoding="async"
            />
            <span class="topbar-title">MC Recovery Fund</span>
          </div>
          <div style="display: flex; gap: 8px; align-items: center">
            <button class="btn-icon" id="backBtn" aria-label="Назад" style="display: none">
              <svg
                width="24"
                height="24"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M19 12H5M12 19l-7-7 7-7" />
              </svg>
            </button>
            <button
              class="btn-icon"
              id="themeToggle"
              aria-label="Переключить тему"
              title="Переключить тему"
            >
              <svg
                class="theme-icon-sun"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              >
                <path
                  d="M12 4V2m0 20v-2M4 12H2m20 0h-2M5.64 5.64l-1.42-1.42M19.78 19.78l-1.42-1.42M5.64 18.36l-1.42 1.42M19.78 4.22l-1.42 1.42"
                />
                <circle cx="12" cy="12" r="4" fill="currentColor" />
              </svg>
              <svg
                class="theme-icon-moon"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="currentColor"
                style="display: none"
              >
                <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z" />
              </svg>
            </button>
          </div>
        </div>
      </header>

      <!-- Main Content Area -->
      <main id="content" class="content content-wrapper">
        <!-- Screens will be injected here -->
      </main>

      <!-- Tab Bar Navigation -->
      <nav id="tabBar" class="tab-bar">
        <!-- Tab items will be injected by JavaScript -->
      </nav>

      <!-- Splash Screen -->
      <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
          <div class="splash-logo-wrapper">
            <div class="splash-logo-glow" aria-hidden="true"></div>
            <img
              src="./assets/images/logo-mc-recovery.webp"
              alt="MC Recovery Fund"
              class="splash-logo"
              loading="eager"
              decoding="sync"
            />
          </div>
          <h1 class="splash-title">MC Recovery Fund</h1>
          <p class="splash-subtitle">
            Интерактивное образовательно-развлекательное приложение для
            участников MC Recovery Fund
          </p>
          <div class="splash-loader">
            <p class="splash-loading-text">Загрузка 0%</p>
            <div class="splash-progress">
              <div class="splash-progress-bar"></div>
            </div>
          </div>
        </div>
        <div class="splash-footer">
          <p class="splash-version">v1.5.0</p>
        </div>
      </div>
    </div>

    <!-- Optimized Data Loading Strategy -->
    <script src="./js/init-data-loader.js"></script>
    <script type="module" src="./js/app-main.js"></script>
    <!-- Onboarding загружается динамически только когда нужен -->
  </body>
</html>
